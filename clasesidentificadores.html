<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            margin: 20px;
        }
        #soyespecial{
            color: aquamarine;
        }
        .soyespeciales{
            color: blueviolet;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Identificadores</h1>
    <p>Los identificadores permiten seleccionar un solo elemento de una pagina web.</p>
    <p>Este es un parrafo normal</p>
    <p id="soyespecial">
        Este parrafo es seleccionado.
    </p>
    <h1>Clases</h1>
    <p>Las clases hacen referencia a 2 o mas elementos de una pagina.</p>
    <p class="soyespeciales">
        Somos especiales
    </p>
    <p class="soyespeciales">Porque somos de la misma clase</p>
</body>
</html>
